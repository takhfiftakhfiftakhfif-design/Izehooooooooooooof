<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تخفیفات ایذه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --main: #ff3e3e; --bg: #0f172a; --card: #1e293b; --accent: #00f2fe; }
        body { font-family: Vazirmatn, sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 100px; user-select: none; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

        /* هدر */
        .site-header { text-align: center; padding: 20px 10px 10px; }
        .site-title { font-size: 26px; font-weight: 900; color: var(--main); margin: 0; }
        .site-slogan { font-size: 13px; color: var(--accent); margin-top: 5px; }

        /* متن روان */
        .marquee-container { background: #000; color: #fff; padding: 10px 0; overflow: hidden; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-top: 10px; }
        .marquee-content { display: inline-block; white-space: nowrap; animation: scroll-text 20s linear infinite; font-size: 14px; font-weight: bold; }
        @keyframes scroll-text { from { transform: translateX(-100%); } to { transform: translateX(100vw); } }

        /* استوری‌ها */
        .story-bar { display: flex; gap: 15px; padding: 20px 15px; overflow-x: auto; scrollbar-width: none; min-height: 110px; }
        .story-circle { min-width: 70px; text-align: center; position: relative; animation: fadeIn 0.5s ease-in; }
        .story-circle img, .story-circle video { width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--main); object-fit: cover; padding: 2px; }
        .story-circle span { font-size: 11px; display: block; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* کارت‌ها */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .offer-card { background: var(--card); border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: fadeIn 0.5s ease-in; }
        .offer-card img, .offer-card video { width: 100%; height: 150px; object-fit: cover; }
        .off-tag { position: absolute; top: 8px; left: 8px; background: var(--main); color: white; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; z-index: 5; }

        /* مودال */
        #modal { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        .progress-container { position: absolute; top: 10px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,0.2); z-index: 10001; }
        #progress-bar { height: 100%; background: white; width: 0%; transition: width 0.1s linear; }
        .modal-body { height: 100%; display: flex; flex-direction: column; }
        .media-viewer { flex: 2; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        .modal-media { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info-panel { flex: 1; background: var(--bg); border-top: 2px solid #333; padding: 20px; overflow-y: auto; border-radius: 25px 25px 0 0; margin-top: -20px; }
        
        /* دکمه بستن پایین */
        .close-footer { padding: 15px; background: var(--bg); text-align: center; }
        .btn-close { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #444; background: none; color: white; font-size: 20px; cursor: pointer; }

        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: bold; text-align: center; text-decoration: none; color: white; font-size: 13px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">تخفیفات ایذه</h1>
        <div class="site-slogan">کی تو ایذه تخفیف گذاشته؟</div>
    </header>

    <div class="marquee-container">
        <div class="marquee-content" id="marquee-text">در حال لود تخفیفات ویژه شهر ایذه...</div>
    </div>

    <div class="story-bar" id="story-render"></div>
    <div class="main-grid" id="offer-render"></div>

    <div id="modal" onmousedown="pauseStory()" onmouseup="resumeStory()" ontouchstart="pauseStory()" ontouchend="resumeStory()">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div class="modal-body">
            <div class="media-viewer" id="media-box"></div>
            <div class="info-panel">
                <h2 id="m-title" style="margin:0; color:var(--accent);"></h2>
                <div id="m-desc" style="margin-top:10px; font-size:14px; color:#ccc; line-height:1.6;"></div>
                <div class="modal-btns">
                    <a id="m-call" class="btn" style="background:#27ae60;">📞 تماس</a>
                    <a id="m-insta" target="_blank" class="btn" style="background:linear-gradient(45deg, #f09433, #bc1888);">📸 اینستاگرام</a>
                </div>
            </div>
            <div class="close-footer">
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>
        </div>
    </div>

    <script>
        let allData = {};
        let timer, progress = 0, isPaused = false;
        const duration = 7000; 

        async function init() {
            // لود تنظیمات
            fetch('db/config.json').then(r => r.json()).then(d => {
                document.getElementById('marquee-text').innerText = d.marquee;
            }).catch(() => {});

            // لود ۱۰ استوری
            for (let i = 1; i <= 10; i++) {
                loadItem(`db/stories/${i}.json`, 'story', i);
            }

            // لود ۵۰ کارت
            for (let i = 1; i <= 50; i++) {
                loadItem(`db/offers/${i}.json`, 'offer', i);
            }
        }

        async function loadItem(url, type, id) {
            try {
                const res = await fetch(url + '?v=' + Date.now());
                if(!res.ok) return;
                const data = await res.json();
                if(!data.active) return;

                const globalId = type + '_' + id;
                allData[globalId] = data;

                const isVid = data.img.toLowerCase().endsWith('.mp4');
                const media = isVid ? `<video muted loop playsinline autoplay><source src="${data.img}"></video>` : `<img src="${data.img}">`;

                if(type === 'story') {
                    document.getElementById('story-render').innerHTML += `
                        <div class="story-circle" onclick="openModal('${globalId}')">
                            ${media}<span>${data.name}</span>
                        </div>`;
                } else {
                    const offTag = data.off ? `<div class="off-tag">${data.off}</div>` : '';
                    document.getElementById('offer-render').innerHTML += `
                        <div class="offer-card" onclick="openModal('${globalId}')">
                            ${offTag}${media}
                            <div style="padding:10px; font-weight:bold; font-size:12px; text-align:center;">${data.name}</div>
                        </div>`;
                }
            } catch(e) {}
        }

        function openModal(gid) {
            const item = allData[gid];
            const isVid = item.img.toLowerCase().endsWith('.mp4');
            document.getElementById('media-box').innerHTML = isVid 
                ? `<video id="m-video" class="modal-media" autoplay playsinline><source src="${item.img}"></video>` 
                : `<img src="${item.img}" class="modal-media">`;
            
            document.getElementById('m-title').innerText = item.name;
            document.getElementById('m-desc').innerText = item.desc;
            document.getElementById('m-call').href = "tel:" + item.phone;
            document.getElementById('m-insta').href = item.insta;

            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            startProgress();
        }

        function startProgress() {
            progress = 0; clearInterval(timer);
            timer = setInterval(() => {
                if(!isPaused) {
                    progress += (100 / (duration / 50));
                    document.getElementById('progress-bar').style.width = progress + '%';
                    if(progress >= 100) closeModal();
                }
            }, 50);
        }

        function pauseStory() { isPaused = true; const v = document.getElementById('m-video'); if(v) v.pause(); }
        function resumeStory() { isPaused = false; const v = document.getElementById('m-video'); if(v) v.play(); }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
            clearInterval(timer);
            const v = document.getElementById('m-video'); if(v) v.pause();
        }

        window.onload = init;
    </script>
</body>
</html>
