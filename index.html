<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تخفیفات ایذه</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --main: #ff3e3e; --bg: #0f172a; --card: #1e293b; }
        body { font-family: Vazirmatn, sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 90px; overflow-x: hidden; }

        /* نصب PWA */
        #pwa-banner { display: none; background: #fff; color: #000; padding: 12px; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #pwa-banner button { background: var(--main); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; }

        /* متن روان */
        .marquee-container { background: #000; color: #00f2fe; padding: 10px 0; overflow: hidden; border-bottom: 1px solid #333; }
        .marquee-content { display: inline-block; white-space: nowrap; animation: scroll 20s linear infinite; }
        @keyframes scroll { from { transform: translateX(-100%); } to { transform: translateX(100vw); } }

        /* استوری‌ها */
        .story-bar { display: flex; gap: 15px; padding: 20px; overflow-x: auto; scrollbar-width: none; }
        .story-circle { min-width: 75px; text-align: center; cursor: pointer; }
        .story-circle img { width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--main); padding: 2px; object-fit: cover; }
        .story-circle span { font-size: 11px; display: block; margin-top: 5px; }

        /* کارت‌های تخفیف */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .offer-card { background: var(--card); border-radius: 20px; overflow: hidden; position: relative; cursor: pointer; }
        .offer-card img { width: 100%; height: 160px; object-fit: cover; }
        .offer-badge { position: absolute; top: 10px; right: 10px; background: var(--main); padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .offer-name { padding: 10px; font-size: 13px; font-weight: bold; text-align: center; }

        /* مودال (پنجره بازشو) */
        #modal { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; }
        .modal-content { height: 100%; display: flex; flex-direction: column; position: relative; }
        .modal-img { width: 100%; height: 60%; object-fit: contain; background: #111; }
        .modal-info { padding: 25px; flex-grow: 1; background: var(--bg); border-top-left-radius: 30px; border-top-right-radius: 30px; margin-top: -30px; }
        .close-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 10; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border-radius: 15px; border: none; color: white; font-weight: bold; text-decoration: none; text-align: center; font-size: 14px; cursor: pointer; }
        .btn-call { background: #27ae60; }
        .btn-insta { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
        .btn-share { background: #444; }

        .pulse-btn { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: #27ae60; color: white; width: 90%; padding: 15px; border-radius: 50px; border: none; font-weight: bold; animation: pulse 2s infinite; z-index: 900; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(39, 174, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); } }
    </style>
</head>
<body>

    <div id="pwa-banner">
        <span>📲 نصب نسخه اپلیکیشن</span>
        <button id="install-btn">نصب</button>
    </div>

    <div class="marquee-container">
        <div class="marquee-content" id="marquee-text">درحال بارگذاری...</div>
    </div>

    <div class="story-bar" id="story-render"></div>
    <div class="main-grid" id="offer-render"></div>

    <button class="pulse-btn">✨ تبلیغ شما در اینجا (۰۹۲۲۰۷۳۰۶۲۸)</button>

    <div id="modal">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div class="modal-content">
            <img id="modal-img" class="modal-img">
            <div class="modal-info">
                <h2 id="modal-title" style="margin-top:0"></h2>
                <p id="modal-desc" style="line-height:1.6; color:#ccc;"></p>
                <div class="modal-btns">
                    <a id="modal-call" class="btn btn-call">📞 تماس</a>
                    <a id="modal-insta" target="_blank" class="btn btn-insta">اینستاگرام</a>
                    <button id="modal-share" class="btn btn-share">📤 اشتراک</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];

        // دریافت داده از JSON
        async function fetchData() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                allData = data.items;
                document.getElementById('marquee-text').innerText = data.config.marquee;
                render();
            } catch (e) { console.error("Data error"); }
        }

        function render() {
            const sBox = document.getElementById('story-render');
            const oBox = document.getElementById('offer-render');
            
            sBox.innerHTML = ''; oBox.innerHTML = '';

            allData.forEach(item => {
                if(item.type === 'story') {
                    sBox.innerHTML += `
                        <div class="story-circle" onclick="openModal(${item.id})">
                            <img src="${item.img}">
                            <span>${item.name}</span>
                        </div>`;
                } else {
                    oBox.innerHTML += `
                        <div class="offer-card" onclick="openModal(${item.id})">
                            <div class="offer-badge">${item.badge || 'ویژه'}</div>
                            <img src="${item.img}">
                            <div class="offer-name">${item.name}</div>
                        </div>`;
                }
            });
        }

        function openModal(id) {
            const item = allData.find(x => x.id === id);
            if(!item) return;

            document.getElementById('modal-img').src = item.img;
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-desc').innerText = item.desc;
            document.getElementById('modal-call').href = "tel:" + item.phone;
            document.getElementById('modal-insta').href = item.insta;
            
            document.getElementById('modal-share').onclick = () => {
                navigator.share({ title: item.name, text: item.desc, url: window.location.href });
            };

            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden'; // غیرفعال کردن اسکرول پس‌زمینه
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // منطق PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-banner').style.display = 'flex';
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                document.getElementById('pwa-banner').style.display = 'none';
            }
        });

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        window.onload = fetchData;
    </script>
</body>
</html>
