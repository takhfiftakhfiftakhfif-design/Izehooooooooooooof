<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izeh Off | ایذه آف</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        :root { --accent: #00f2fe; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: Vazirmatn, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 100px; }

        /* نوار متحرک نئونی */
        .neon-marquee { background: #000; color: var(--accent); padding: 10px 0; border-bottom: 1px solid var(--accent); font-size: 14px; overflow: hidden; }
        .m-scroll { display: flex; white-space: nowrap; animation: scroll 25s linear infinite; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(100%); } }

        /* هدر استوری‌ها */
        .story-section { display: flex; gap: 15px; padding: 20px; overflow-x: auto; scrollbar-width: none; }
        .story-card { min-width: 70px; text-align: center; }
        .story-card img { width: 70px; height: 70px; border-radius: 22px; border: 2px solid var(--accent); padding: 2px; object-fit: cover; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .story-card span { font-size: 11px; margin-top: 5px; display: block; opacity: 0.8; }

        /* بدنه اصلی - کارت‌ها */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .offer-card { background: var(--card); border-radius: 20px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .offer-card img { width: 100%; height: 150px; object-fit: cover; }
        .badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #000; padding: 2px 10px; border-radius: 10px; font-weight: bold; font-size: 12px; }
        .content { padding: 12px; }
        .content h3 { margin: 0; font-size: 14px; height: 40px; }
        .price { color: var(--accent); font-weight: bold; font-size: 13px; margin-top: 8px; display: block; }

        /* دکمه شناور نصب PWA */
        #pwa-installer { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.9); color: #000; padding: 10px 20px;
            border-radius: 30px; z-index: 9999; display: none; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-weight: bold;
        }

        /* دکمه تماس ثابت */
        .fab { position: fixed; bottom: 20px; right: 20px; background: var(--accent); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4); text-decoration: none; color: #000; z-index: 1000; }
    </style>
</head>
<body>

    <div id="pwa-installer">
        <span>📱 نصب اپلیکیشن ایذه</span>
        <button id="do-install" style="background:var(--accent); border:none; padding:5px 15px; border-radius:15px; cursor:pointer; font-weight:bold;">نصب</button>
    </div>

    <div class="neon-marquee">
        <div class="m-scroll" id="marquee-text">درحال دریافت اطلاعات...</div>
    </div>

    <div class="story-section" id="story-box"></div>

    <div class="main-grid" id="offers-box"></div>

    <a href="#" id="call-btn" class="fab">📞</a>

    <script>
        let deferredPrompt;

        // بارگذاری هوشمند داده‌ها از JSON
        async function loadData() {
            try {
                const response = await fetch('data.json?v=' + Date.now());
                const data = await response.json();

                // ۱. تنظیمات کلی
                document.getElementById('marquee-text').innerText = data.config.marquee;
                document.getElementById('call-btn').href = "tel:" + data.config.contactPhone;

                // ۲. رندر استوری‌ها
                const storyBox = document.getElementById('story-box');
                storyBox.innerHTML = data.stories.map(s => `
                    <div class="story-card">
                        <img src="${s.img}">
                        <span>${s.name}</span>
                    </div>
                `).join('');

                // ۳. رندر کارت‌های تخفیف
                const offersBox = document.getElementById('offers-box');
                offersBox.innerHTML = data.offers.map(o => `
                    <div class="offer-card">
                        <div class="badge">${o.badge}</div>
                        <img src="${o.image}">
                        <div class="content">
                            <h3>${o.title}</h3>
                            <span class="price">${o.price}</span>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error("خطا در بارگذاری فایل JSON", e);
            }
        }

        // منطق نصب واقعی PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-installer').style.display = 'flex';
        });

        document.getElementById('do-install').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('pwa-installer').style.display = 'none';
                deferredPrompt = null;
            }
        });

        // ثبت Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        window.onload = loadData;
    </script>
</body>
</html>
