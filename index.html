<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تخفیفات ایذه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --main: #ff3e3e; --bg: #0f172a; --card: #1e293b; --accent: #00f2fe; }
        body { font-family: Vazirmatn, sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 90px; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* هدر و شعار */
        .site-header { text-align: center; padding: 20px 10px; }
        .site-title { font-size: 26px; font-weight: 900; color: var(--main); margin: 0; }
        .site-slogan { font-size: 13px; color: var(--accent); animation: blink 1.5s infinite; margin-top: 5px; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* استوری‌ها */
        .story-bar { display: flex; gap: 15px; padding: 15px; overflow-x: auto; scrollbar-width: none; }
        .story-circle { min-width: 70px; text-align: center; position: relative; }
        .story-circle img, .story-circle video { width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--main); object-fit: cover; }

        /* شبکه کارت‌ها */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .offer-card { background: var(--card); border-radius: 18px; overflow: hidden; position: relative; }
        .offer-card img, .offer-card video { width: 100%; height: 150px; object-fit: cover; }
        
        /* تگ تخفیف */
        .off-tag { position: absolute; top: 8px; left: 8px; background: var(--main); color: white; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; z-index: 5; }

        /* مودال پیشرفته استوری */
        #modal { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; }
        .progress-container { position: absolute; top: 10px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,0.2); z-index: 10001; }
        #progress-bar { height: 100%; background: white; width: 0%; }

        .modal-body { height: 100%; display: flex; flex-direction: column; }
        .media-viewer { flex: 2; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        .modal-media { max-width: 100%; max-height: 100%; object-fit: contain; }

        .info-panel { flex: 1; background: var(--bg); border-top: 2px solid #333; padding: 20px; overflow-y: auto; position: relative; border-radius: 25px 25px 0 0; margin-top: -20px; }
        
        /* دکمه بستن پایین */
        .close-footer { padding: 10px; background: var(--bg); text-align: center; }
        .btn-close { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #444; background: none; color: white; font-size: 20px; cursor: pointer; }

        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: bold; text-align: center; text-decoration: none; color: white; font-size: 13px; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="site-title">تخفیفات ایذه</h1>
        <div class="site-slogan">کی تو ایذه تخفیف گذاشته؟</div>
    </header>

    <div class="story-bar" id="story-render"></div>
    <div class="main-grid" id="offer-render"></div>

    <div id="modal" onmousedown="pauseStory()" onmouseup="resumeStory()" ontouchstart="pauseStory()" ontouchend="resumeStory()">
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="modal-body">
            <div class="media-viewer" id="media-box"></div>
            
            <div class="info-panel">
                <h2 id="m-title" style="margin:0; color:var(--accent);"></h2>
                <div id="m-desc" style="margin-top:10px; font-size:14px; color:#ccc; line-height:1.6;"></div>
                
                <div class="modal-btns">
                    <a id="m-call" class="btn" style="background:#27ae60;">📞 تماس</a>
                    <a id="m-insta" target="_blank" class="btn" style="background:linear-gradient(45deg, #f09433, #bc1888);">📸 اینستا</a>
                    <button id="m-share" class="btn" style="background:#334155;">📤 اشتراک</button>
                </div>
            </div>

            <div class="close-footer">
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let timer, progress = 0, isPaused = false;
        const duration = 5000; // ۵ ثانیه برای هر استوری

        async function init() {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            allData = data.items;
            render();
        }

        function render() {
            const sBox = document.getElementById('story-render'), oBox = document.getElementById('offer-render');
            sBox.innerHTML = ''; oBox.innerHTML = '';

            allData.forEach(item => {
                const isVid = item.img.toLowerCase().endsWith('.mp4');
                const media = isVid ? `<video muted loop playsinline autoplay><source src="${item.img}"></video>` : `<img src="${item.img}">`;
                const offBadge = item.off ? `<div class="off-tag">${item.off} OFF</div>` : '';

                if(item.type === 'story') {
                    sBox.innerHTML += `<div class="story-circle" onclick="openModal(${item.id})">${media}<span>${item.name}</span></div>`;
                } else {
                    oBox.innerHTML += `
                        <div class="offer-card" onclick="openModal(${item.id})">
                            ${offBadge}
                            ${media}
                            <div style="padding:10px; font-weight:bold; font-size:13px; text-align:center;">${item.name}</div>
                        </div>`;
                }
            });
        }

        function openModal(id) {
            const item = allData.find(x => x.id === id);
            const box = document.getElementById('media-box');
            const isVid = item.img.toLowerCase().endsWith('.mp4');

            box.innerHTML = isVid ? `<video id="m-video" class="modal-media" autoplay playsinline><source src="${item.img}"></video>` : `<img src="${item.img}" class="modal-media">`;
            
            document.getElementById('m-title').innerText = item.name;
            document.getElementById('m-desc').innerText = item.desc;
            document.getElementById('m-call').href = "tel:" + item.phone;
            document.getElementById('m-insta').href = item.insta;
            document.getElementById('m-share').onclick = () => navigator.share({title: item.name, text: item.desc, url: window.location.href});

            document.getElementById('modal').style.display = 'block';
            startProgress();
        }

        function startProgress() {
            progress = 0;
            clearInterval(timer);
            timer = setInterval(() => {
                if(!isPaused) {
                    progress += (100 / (duration / 50));
                    document.getElementById('progress-bar').style.width = progress + '%';
                    if(progress >= 100) closeModal();
                }
            }, 50);
        }

        function pauseStory() { isPaused = true; const v = document.getElementById('m-video'); if(v) v.pause(); }
        function resumeStory() { isPaused = false; const v = document.getElementById('m-video'); if(v) v.play(); }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            clearInterval(timer);
            const v = document.getElementById('m-video'); if(v) v.pause();
        }

        window.onload = init;
    </script>
</body>
</html>
